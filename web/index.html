<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Lunar Landing Site Navigator</title>
  </head>
  <body>
    <!-- Vista del cielo (rediseño #99): la arma src/sky.js. -->
    <section id="sky" class="sky">
      <!-- Panel de búsqueda (Figma frames 3 y 4): nada se aplica hasta tocar "Aplicar" (src/sky-panel.js). -->
      <div id="sky-panel" class="sky-panel" role="dialog" aria-labelledby="sky-panel-intro" hidden>
        <button type="button" class="sky-panel__close" data-sky-close data-i18n-label="sky.panel.close">×</button>
        <p id="sky-panel-intro" class="sky-panel__intro" data-i18n="sky.panel.intro"></p>
        <div class="sky-panel__modes" role="group" aria-labelledby="sky-panel-intro">
          <button type="button" class="sky-mode" data-mode="historical" aria-pressed="false" data-i18n="sky.panel.mode.historical"></button>
          <button type="button" class="sky-mode" data-mode="location" aria-pressed="false" data-i18n="sky.panel.mode.location"></button>
          <button type="button" class="sky-mode" data-mode="map" aria-pressed="false" data-i18n="sky.panel.mode.map"></button>
        </div>
        <div class="sky-pane field" data-pane="historical" hidden>
          <label for="sky-site" data-i18n="sky.panel.historical"></label>
          <select id="sky-site"></select>
        </div>
        <div class="sky-pane" data-pane="location" hidden>
          <section id="live" class="live" hidden></section>
          <p class="sky-panel__note" data-no-api data-i18n="sky.panel.noApi" hidden></p>
        </div>
        <div class="sky-pane" data-pane="map" hidden>
          <p class="sky-panel__note" data-i18n="sky.panel.soon"></p>
        </div>
        <div class="sky-pane field" data-pane="date" hidden>
          <label for="sky-time" data-i18n="sky.panel.date"></label>
          <input id="sky-time" type="datetime-local" />
          <p class="field-hint" data-i18n="selector.timeHint"></p>
        </div>
        <button type="button" class="sky-panel__apply" data-sky-apply data-i18n="sky.panel.apply" hidden></button>
      </div>
      <!-- Controles reales del selector (src/selector.js); el panel los cambia al aplicar. -->
      <div hidden>
        <select id="site" tabindex="-1" aria-hidden="true"></select>
        <input id="time" type="datetime-local" tabindex="-1" aria-hidden="true" />
      </div>
    </section>

    <!-- Más información (Figma frame 2): cajón lateral con el detalle. -->
    <div class="page sky-drawer" id="details" aria-hidden="true" inert>
      <header>
        <div class="topbar">
          <label for="lang" data-i18n="lang.label">Idioma</label>
          <select id="lang"></select>
        </div>
        <h1 class="app-title">Lunar Landing Site Navigator</h1>
        <p class="app-question" data-i18n="app.question"></p>
        <p class="app-intro" data-i18n="app.intro"></p>
      </header>

      <main>
        <section id="player" class="player"></section>

        <p id="notice" hidden></p>
        <section id="panel" aria-live="polite"></section>
        <section id="timeline"></section>
        <section id="compare" class="compare" aria-live="polite"></section>

        <details class="validation">
          <summary data-i18n="validation.title"></summary>
          <div id="validation-body"></div>
        </details>

        <details class="help">
          <summary data-i18n="help.title">¿Qué significan estos números?</summary>
          <dl>
            <dt data-i18n="help.elevation.term"></dt>
            <dd data-i18n="help.elevation.text"></dd>
            <dt data-i18n="help.azimuth.term"></dt>
            <dd data-i18n="help.azimuth.text"></dd>
            <dt data-i18n="help.horizon.term"></dt>
            <dd data-i18n="help.horizon.text"></dd>
            <dt data-i18n="help.dials.term"></dt>
            <dd data-i18n="help.dials.text"></dd>
            <dt data-i18n="help.why.term"></dt>
            <dd data-i18n="help.why.text"></dd>
          </dl>
        </details>
      </main>

      <footer class="footer">
        <p data-i18n="footer.data"></p>
        <p data-i18n="footer.ai"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
