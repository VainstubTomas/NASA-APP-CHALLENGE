<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Lunar Landing Site Navigator</title>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="topbar">
          <label for="lang" data-i18n="lang.label">Idioma</label>
          <select id="lang"></select>
        </div>
        <h1 class="app-title">Lunar Landing Site Navigator</h1>
        <p class="app-question" data-i18n="app.question"></p>
        <p class="app-intro" data-i18n="app.intro"></p>
      </header>

      <main>
        <section class="controls">
          <div class="field">
            <label for="site" data-i18n="selector.site">Sitio de aterrizaje</label>
            <select id="site"></select>
          </div>
          <div class="field">
            <label for="time" data-i18n="selector.time">Fecha y hora (UTC)</label>
            <input id="time" type="datetime-local" />
            <p class="field-hint" data-i18n="selector.timeHint"></p>
          </div>
        </section>

        <p id="notice" hidden></p>
        <section id="panel" aria-live="polite"></section>

        <details class="validation">
          <summary data-i18n="validation.title"></summary>
          <div id="validation-body"></div>
        </details>

        <details class="help">
          <summary data-i18n="help.title">¿Qué significan estos números?</summary>
          <dl>
            <dt data-i18n="help.elevation.term"></dt>
            <dd data-i18n="help.elevation.text"></dd>
            <dt data-i18n="help.azimuth.term"></dt>
            <dd data-i18n="help.azimuth.text"></dd>
            <dt data-i18n="help.horizon.term"></dt>
            <dd data-i18n="help.horizon.text"></dd>
            <dt data-i18n="help.why.term"></dt>
            <dd data-i18n="help.why.text"></dd>
          </dl>
        </details>
      </main>

      <footer class="footer">
        <p data-i18n="footer.data"></p>
        <p data-i18n="footer.ai"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
