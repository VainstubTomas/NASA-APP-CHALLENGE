name: Post-merge de PR
on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  cerrar-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Etiquetar y cerrar issues linkeadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh label create "ready:to:main" --repo "$REPO" --color 0E8A16 2>/dev/null || true

          linked=$(gh api graphql -f query='
            query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){
                pullRequest(number:$n){
                  closingIssuesReferences(first:20){nodes{number}}
                }
              }
            }' -f o="${REPO%/*}" -f r="${REPO#*/}" -F n="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          from_branch=$(echo "$BRANCH" | sed -nE 's#^(feature|fix)/([0-9]+)-.*#\2#p')

          for n in $(printf '%s\n%s\n' "$linked" "$from_branch" | grep -E '^[0-9]+$' | sort -u); do
            gh issue edit "$n" --repo "$REPO" --add-label "ready:to:main"
            gh issue close "$n" --repo "$REPO" --reason completed || true
          done